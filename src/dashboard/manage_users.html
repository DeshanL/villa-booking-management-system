<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Freedom Villa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: #f4f7f6;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            height: 100vh;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 40px;
            text-align: center;
        }

        .menu-item {
            display: block;
            padding: 15px;
            color: #ecf0f1;
            text-decoration: none;
            margin-bottom: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .menu-item:hover {
            background: #34495e;
        }

        .menu-item.active {
            background: #3498db;
        }

        .content {
            flex: 1;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h2>Freedom Villa</h2>
        <a href="admin_dashboard.html" class="menu-item">Dashboard</a>
        <a href="admin_dashboard.html" class="menu-item">Manage Rooms</a>
        <a href="admin_dashboard.html" class="menu-item">Bookings</a>
        <a href="admin_dashboard.html" class="menu-item">Employees</a>
        <a href="admin_dashboard.html" class="menu-item">Expenses</a>
        <a href="#" class="menu-item active">Users</a>
        <a href="admin_dashboard.html" class="menu-item">Backup</a>
        <br><br>
        <a href="#" onclick="logout()" class="menu-item" style="background: #c0392b;">Logout</a>
    </div>

    <div class="content">
        <div class="header">
            <h1>User Management</h1>
            <div>Admin Panel</div>
        </div>

        <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>System Users</h3>
                <button onclick="showUserModal()"
                    style="background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">+
                    Add User</button>
            </div>
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; border-bottom: 1px solid #eee;">
                        <th style="padding: 10px;">Name</th>
                        <th style="padding: 10px;">Username</th>
                        <th style="padding: 10px;">Role</th>
                        <th style="padding: 10px;">Action</th>
                    </tr>
                </thead>
                <tbody id="userList"></tbody>
            </table>
        </div>
    </div>

    <!-- USER MODAL -->
    <div id="userModal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 10px; width: 400px; max-width: 90%;">
            <h2 style="margin-top: 0; color: #2c3e50;" id="userModalTitle">Add User</h2>

            <form id="userForm" onsubmit="event.preventDefault(); saveUser();">
                <input type="hidden" id="userId">

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; color: #666;">Name</label>
                    <input type="text" id="uName" required
                        style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; color: #666;">Username</label>
                    <input type="text" id="uUsername" required
                        style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; color: #666;">Password</label>
                    <input type="password" id="uPassword" placeholder="Password"
                        style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; color: #666;">Role</label>
                    <select id="uRole"
                        style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" onclick="closeUserModal()"
                        style="padding: 10px 20px; border: 1px solid #ddd; background: white; border-radius: 5px; cursor: pointer;">Cancel</button>
                    <button type="submit"
                        style="padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">Save
                        User</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        function logout() {
            ipcRenderer.send('logout');
        }

        function showUserModal(user = null) {
            document.getElementById('userModal').style.display = 'flex';
            if (user) {
                document.getElementById('userModalTitle').innerText = 'Edit User';
                document.getElementById('userId').value = user.id;
                document.getElementById('uName').value = user.name;
                document.getElementById('uUsername').value = user.username;
                document.getElementById('uUsername').disabled = true;
                document.getElementById('uRole').value = user.role;
                document.getElementById('uPassword').placeholder = "Leave blank to keep current";
            } else {
                document.getElementById('userModalTitle').innerText = 'Add User';
                document.getElementById('userId').value = '';
                document.getElementById('uName').value = '';
                document.getElementById('uUsername').value = '';
                document.getElementById('uUsername').disabled = false;
                document.getElementById('uRole').value = 'user';
                document.getElementById('uPassword').placeholder = "Password";
            }
        }

        function closeUserModal() {
            document.getElementById('userModal').style.display = 'none';
            document.getElementById('userForm').reset();
        }

        async function loadUsers() {
            const users = await ipcRenderer.invoke('get-users');
            const tbody = document.getElementById('userList');
            tbody.innerHTML = '';

            users.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="padding: 10px;">${u.name}</td>
                    <td style="padding: 10px;">${u.username}</td>
                    <td style="padding: 10px; text-transform: capitalize;">${u.role}</td>
                    <td style="padding: 10px;">
                        <button onclick='showUserModal(${JSON.stringify(u)})' style="background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Edit</button>
                        <button onclick="deleteUser('${u.id}')" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin-left: 5px;">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function saveUser() {
            const id = document.getElementById('userId').value;
            const name = document.getElementById('uName').value;
            const username = document.getElementById('uUsername').value;
            const password = document.getElementById('uPassword').value;
            const role = document.getElementById('uRole').value;

            if (!name || !username) return alert("Please fill required fields");
            if (!id && !password) return alert("Password required for new user");

            const userData = { id, name, username, password, role };

            let result;
            if (id) {
                result = await ipcRenderer.invoke('update-user', userData);
            } else {
                result = await ipcRenderer.invoke('add-user', userData);
            }

            if (result.success) {
                closeUserModal();
                loadUsers();
            } else {
                alert("Error: " + result.error);
            }
        }

        async function deleteUser(id) {
            if (confirm("Delete this user?")) {
                const result = await ipcRenderer.invoke('delete-user', id);
                if (result.success) loadUsers();
                else alert("Error: " + result.error);
            }
        }

        loadUsers();

        // Aggressive focus fix for manage users page
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.click();
                document.body.focus();
            }, 500);
            setTimeout(() => {
                document.body.click();
            }, 1500);
        });
    </script>
</body>

</html>
